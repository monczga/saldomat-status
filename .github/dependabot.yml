# Dependabot — opens PRs to bump dependencies + GitHub Actions when
# a CVE / new release lands. S-P1-10 follow-up — last remaining of
# 8 repos to add Dependabot coverage.
#
# Upptime-specific constraint: all workflow files under
# `.github/workflows/*.yml` are AUTO-GENERATED by the Upptime
# template (`update-template.yml` runs weekly) and carry a
# "Do not edit this file directly!" header. Pinning action SHAs in
# them would be reverted on the next template run.
#
# Dependabot still adds value here because:
#   1. It opens PRs to bump the `peaceiris/actions-gh-pages` step in
#      site.yml when a new release ships — even if the PR is
#      overwritten by an Upptime template update, the GH advisory
#      surfaces in our dependency graph.
#   2. The Upptime template itself (`upptime/uptime-monitor`) is
#      version-pinned in the workflows; dependabot bumps the
#      template-pin to a newer Upptime release.
#
# No npm/pip — this repo is a YAML-config-only Upptime instance.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Warsaw"
    open-pull-requests-limit: 2
    labels: ["dependencies", "ci"]
